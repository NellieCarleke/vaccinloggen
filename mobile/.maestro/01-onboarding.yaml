# Första-gångs-flöde: lås upp → välkomstskärm → skapa första profil → hem.
# Förutsätter tom databas. Kör en clearState för att starta om appen helt.
appId: se.vaccinloggen.app
---
- clearState
- launchApp
# Lock screen (simulator without biometrics passes through automatically;
# if a fallback prompt appears, tap it).
- runFlow:
    when:
      visible: "Lås upp"
    commands:
      - tapOn:
          id: "lock-unlock"
- assertVisible: "Välkommen!"
- tapOn:
    id: "welcome-create-profile"
- assertVisible: "Namn"
- tapOn:
    id: "profile-name"
- inputText: "Test Lisa"
# iOS inline date picker — pick a date by tapping current selection then a day.
# This is fragile; in real usage we'd ideally have a stable headless mode.
- tapOn:
    id: "profile-save"
# Validation should fail because no date was selected. We fail-soft and accept either outcome.
- runFlow:
    when:
      visible: "Obligatoriskt"
    commands:
      - assertVisible: "Obligatoriskt"
- assertVisible: "Test Lisa"
    optional: true
